# Indicative fee quoted to the prospect, per debt band. Pinnacle quotes fees as MONTHLY INSTALMENTS.
# Leave a band as null and the bot will NOT quote a fee for it - it just says a consultant will confirm.
# Format:
#   "<band key>": {monthly_min: 1500, monthly_max: 2000, months: 24}
# `months` (the term) is optional. Band keys are "<from>-<to>" in rand, "500000+" for the open-ended top band.
"0-100000": null
"100000-120000": null
"120000-150000": null
"150000-200000": null
"200000-300000": null
"300000-500000": null
"500000+": null
